# Keeps the staging branch (beta) up to date with production (main).
# Fast-forwards beta when it has no commits of its own, so no new commit is created and the
# original signatures stay. If beta has its own work, GitHub merges main into it (a merge
# commit GitHub signs itself). On a conflict the run fails and nothing is overwritten.
name: Sync beta with main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-beta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward beta or merge main into it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin beta >/dev/null; then
            git push origin "$GITHUB_SHA:refs/heads/beta"
            exit 0
          fi
          git fetch origin beta
          if git merge-base --is-ancestor origin/beta "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/beta"
          else
            gh api "repos/$GITHUB_REPOSITORY/merges" \
              -f base=beta -f head="$GITHUB_SHA" \
              -f commit_message="Merge main into beta"
          fi
